<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STATIC — Storefront Picture & Category Manager</title>
  <link rel="icon" type="image/png" href="images/1111-removebg-preview.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>window.lucide || document.write('<script src="lucide.min.js"><\/script>')</script>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Dedicated Admin Styles */
    .admin-page {
      background: var(--beige-200);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .admin-header {
      background: var(--coffee-900);
      color: var(--beige-100);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .admin-brand img {
      height: 36px;
      width: auto;
      filter: brightness(0) invert(0.95);
    }
    .admin-title-wrap h1 {
      font-size: 1.15rem;
      font-family: var(--font-body);
      font-weight: 700;
      color: var(--beige-100);
      letter-spacing: 0.04em;
    }
    .admin-title-wrap p {
      font-size: 0.75rem;
      color: var(--coffee-300);
    }
    .admin-header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .admin-container {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 24px;
    }
    .admin-card {
      background: var(--beige-100);
      border-radius: var(--radius-xl);
      border: 1.5px solid var(--beige-300);
      padding: 32px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    /* Lock Screen */
    .lock-screen {
      max-width: 420px;
      margin: 80px auto;
      text-align: center;
    }
    .lock-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--coffee-100);
      color: var(--coffee-800);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .lock-screen h2 {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    .lock-screen p {
      color: var(--coffee-500);
      font-size: 0.88rem;
      margin-bottom: 24px;
    }
    /* Stats Row */
    .admin-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--beige-100);
      border: 1.5px solid var(--beige-300);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--coffee-100);
      color: var(--coffee-800);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stat-info .stat-val {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--coffee-800);
      line-height: 1;
    }
    .stat-info .stat-label {
      font-size: 0.78rem;
      color: var(--coffee-500);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 4px;
    }
    /* Controls Bar */
    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    .admin-search-wrap {
      position: relative;
      flex: 1;
      max-width: 360px;
    }
    .admin-search-wrap input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--beige-300);
      background: var(--beige-100);
      font-size: 0.88rem;
      outline: none;
    }
    .admin-search-wrap i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--coffee-400);
      pointer-events: none;
    }
    .admin-action-btns {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Product Item Editor Cards */
    .admin-items-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    .admin-item-card {
      background: var(--beige-100);
      border: 1.5px solid var(--beige-300);
      border-radius: var(--radius-xl);
      padding: 24px;
      display: grid;
      grid-template-columns: 160px 1fr auto;
      gap: 24px;
      align-items: start;
      box-shadow: var(--shadow-sm);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .admin-item-card:hover {
      border-color: var(--coffee-400);
      box-shadow: var(--shadow-md);
    }
    .admin-item-card.has-custom {
      border-left: 5px solid var(--coffee-800);
    }
    /* Image Preview Column */
    .admin-img-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .admin-img-preview {
      width: 150px;
      height: 150px;
      border-radius: var(--radius-lg);
      object-fit: cover;
      background: var(--beige-200);
      border: 1.5px solid var(--beige-300);
      box-shadow: var(--shadow-xs);
    }
    .upload-btn-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--coffee-700);
      background: var(--beige-200);
      padding: 7px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      border: 1px solid var(--beige-300);
      transition: background var(--transition);
    }
    .upload-btn-label:hover {
      background: var(--beige-300);
    }
    .upload-btn-label input {
      display: none;
    }
    /* Form Fields Column */
    .admin-fields-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .item-header-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .item-title {
      font-size: 1.25rem;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--coffee-800);
    }
    .item-sku-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 8px;
      background: var(--beige-300);
      border-radius: var(--radius-sm);
      color: var(--coffee-600);
    }
    .item-stock-tag {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--coffee-600);
    }
    .admin-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .admin-input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .admin-input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      color: var(--coffee-600);
    }
    .admin-input-group input,
    .admin-input-group select,
    .admin-input-group textarea {
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--beige-300);
      background: var(--beige-100);
      font-size: 0.85rem;
      color: var(--coffee-800);
      outline: none;
    }
    .admin-input-group input:focus,
    .admin-input-group select:focus,
    .admin-input-group textarea:focus {
      border-color: var(--coffee-700);
    }
    .preset-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .preset-btn {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--beige-300);
      background: var(--beige-200);
      color: var(--coffee-700);
      cursor: pointer;
    }
    .preset-btn:hover {
      background: var(--beige-300);
    }
    /* Actions Column */
    .admin-actions-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: stretch;
    }
    .save-item-btn {
      padding: 10px 16px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .reset-item-btn {
      font-size: 0.75rem;
      color: #c0392b;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px;
      text-align: center;
    }
    @media (max-width: 860px) {
      .admin-item-card {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .admin-img-col {
        flex-direction: row;
        align-items: center;
      }
      .admin-img-preview {
        width: 90px;
        height: 90px;
      }
      .admin-form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="admin-page">

  <!-- ADMIN HEADER -->
  <header class="admin-header">
    <div class="admin-brand">
      <img src="images/1111-removebg-preview.png" alt="STATIC Logo" />
      <div class="admin-title-wrap">
        <h1>STATIC Storefront Manager</h1>
        <p>Zero-Neon Picture Database &amp; Category Controller</p>
      </div>
    </div>
    <div class="admin-header-actions">
      <a href="shop.html" class="btn btn-outline" style="border-color:rgba(255,255,255,.3);color:var(--beige-100);" target="_blank">
        <i data-lucide="external-link" class="icon-xs"></i> view shop
      </a>
      <button type="button" class="btn btn-dark" id="lock-btn" style="display:none;" onclick="lockAdmin()">
        <i data-lucide="lock" class="icon-xs"></i> lock
      </button>
    </div>
  </header>

  <!-- LOCK SCREEN (PIN GUARD) -->
  <div class="admin-container" id="lock-section">
    <div class="admin-card lock-screen">
      <div class="lock-icon">
        <i data-lucide="lock" class="icon-md"></i>
      </div>
      <h2>Storefront Admin Access</h2>
      <p>Enter your 4-digit admin PIN to customize sticker images and categories.</p>
      <form id="pin-form" onsubmit="handlePinSubmit(event)">
        <div class="admin-input-group" style="margin-bottom:16px;">
          <input type="password" id="pin-input" placeholder="Enter PIN (Default: 2026)" maxlength="10" style="font-size:1.2rem;text-align:center;letter-spacing:4px;" required autocomplete="current-password" autofocus />
        </div>
        <p id="pin-error" style="color:#c0392b;font-size:.85rem;margin-bottom:12px;"></p>
        <button type="submit" class="btn btn-primary full-width">
          unlock dashboard <i data-lucide="arrow-right" class="icon-sm"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION (UNLOCKED) -->
  <div class="admin-container" id="dashboard-section" style="display:none;">

    <!-- STATS -->
    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="package" class="icon-sm"></i></div>
        <div class="stat-info">
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-label">Stock Items</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="image" class="icon-sm"></i></div>
        <div class="stat-info">
          <div class="stat-val" id="stat-posters">0</div>
          <div class="stat-label">Posters</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="tag" class="icon-sm"></i></div>
        <div class="stat-info">
          <div class="stat-val" id="stat-single">0</div>
          <div class="stat-label">Single Stickers</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i data-lucide="sparkles" class="icon-sm"></i></div>
        <div class="stat-info">
          <div class="stat-val" id="stat-sheets">0</div>
          <div class="stat-label">Sticker Sheets</div>
        </div>
      </div>
    </div>

    <!-- TOOLBAR -->
    <div class="admin-card">
      <div class="admin-toolbar">
        <div class="admin-search-wrap">
          <i data-lucide="search" class="icon-sm"></i>
          <input type="text" id="admin-search" placeholder="Search items by name or SKU..." oninput="filterAdminItems()" />
        </div>
        <div class="admin-action-btns">
          <button type="button" class="btn btn-outline" onclick="exportPictureConfig()" title="Export JSON backup">
            <i data-lucide="download" class="icon-xs"></i> export
          </button>
          <label class="btn btn-outline" style="cursor:pointer;margin:0;" title="Import JSON backup">
            <i data-lucide="upload" class="icon-xs"></i> import
            <input type="file" accept=".json" onchange="importPictureConfig(event)" style="display:none;" />
          </label>
          <button type="button" class="btn btn-primary" onclick="saveAllItems()">
            <i data-lucide="save" class="icon-xs"></i> save all changes
          </button>
        </div>
      </div>

      <!-- INVENTORY LIST -->
      <div id="admin-items-list" class="admin-items-grid">
        <div style="text-align:center;padding:40px;color:var(--coffee-500);">
          <i data-lucide="loader-2" class="icon-md" style="animation:spin 1s linear infinite"></i>
          <p style="margin-top:8px;">Loading stock from expense tracker...</p>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script>
    /* ══════════════════════════════════════════════════════
       STOREFRONT ADMIN & PICTURE DB CONTROLLER
       ══════════════════════════════════════════════════════ */
    const ADMIN_PIN = "2026";
    let adminStockItems = [];
    let customPictureMap = {};

    // ── INITIALIZE ──
    document.addEventListener("DOMContentLoaded", () => {
      customPictureMap = getStorefrontPictureMap();
      if (sessionStorage.getItem("static_admin_unlocked") === "true") {
        showDashboard();
      }
      renderIcons();
    });

    // ── PIN AUTH ──
    function handlePinSubmit(e) {
      e.preventDefault();
      const pin = (document.getElementById("pin-input")?.value || "").trim();
      const errEl = document.getElementById("pin-error");
      if (pin === ADMIN_PIN || pin === "static2026") {
        sessionStorage.setItem("static_admin_unlocked", "true");
        showDashboard();
      } else {
        if (errEl) errEl.textContent = "Incorrect PIN. Please try again.";
      }
    }

    function lockAdmin() {
      sessionStorage.removeItem("static_admin_unlocked");
      document.getElementById("lock-section").style.display = "block";
      document.getElementById("dashboard-section").style.display = "none";
      document.getElementById("lock-btn").style.display = "none";
      document.getElementById("pin-input").value = "";
    }

    async function showDashboard() {
      document.getElementById("lock-section").style.display = "none";
      document.getElementById("dashboard-section").style.display = "block";
      document.getElementById("lock-btn").style.display = "inline-flex";
      await fetchStockForAdmin();
      renderIcons();
    }

    // ── FETCH LIVE STOCK ──
    async function fetchStockForAdmin() {
      const container = document.getElementById("admin-items-list");
      try {
        const res = await fetch("https://expense-sys-ten.vercel.app/api/stock/public");
        adminStockItems = await res.json();
        if (!adminStockItems.length) {
          adminStockItems = getFallbackProducts().map(p => ({
            id: p.id,
            itemName: p.name,
            sku: p.sku,
            price: p.price,
            quantity: p.qty,
          }));
        }
        renderAdminItems();
        updateAdminStats();
      } catch (err) {
        console.error("Error fetching stock:", err);
        adminStockItems = getFallbackProducts().map(p => ({
          id: p.id,
          itemName: p.name,
          sku: p.sku,
          price: p.price,
          quantity: p.qty,
        }));
        renderAdminItems();
        updateAdminStats();
      }
    }

    // ── RENDER ADMIN ITEMS ──
    function renderAdminItems(itemsToRender = adminStockItems) {
      const container = document.getElementById("admin-items-list");
      if (!container) return;

      if (!itemsToRender.length) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--coffee-500);"><p>No items found matching your search.</p></div>`;
        return;
      }

      container.innerHTML = itemsToRender.map(item => {
        const custom = customPictureMap[item.id] || customPictureMap[item.itemName] || {};
        const currentCategory = custom.category || inferCategory(item.itemName, item.sku);
        const currentImg = custom.img || getProductImage(item.itemName, item.sku);
        const currentBadge = custom.badge || "";
        const currentDesc = custom.desc || "";

        return `
          <div class="admin-item-card ${custom.img || custom.category ? "has-custom" : ""}" id="card-${item.id}">
            <!-- Photo Preview & File Uploader -->
            <div class="admin-img-col">
              <img src="${currentImg}" alt="${item.itemName}" class="admin-img-preview" id="img-preview-${item.id}" />
              <label class="upload-btn-label">
                <i data-lucide="upload" class="icon-xs"></i> change photo
                <input type="file" accept="image/*" onchange="handleImageUpload('${item.id}', event)" />
              </label>
            </div>

            <!-- Fields -->
            <div class="admin-fields-col">
              <div class="item-header-row">
                <span class="item-title">${item.itemName}</span>
                ${item.sku ? `<span class="item-sku-tag">${item.sku}</span>` : ""}
                <span class="item-stock-tag">✦ ${item.quantity} in stock · ${item.price > 0 ? item.price + " EGP" : "Price TBD"}</span>
              </div>

              <!-- Photo URL & Presets -->
              <div class="admin-input-group">
                <label>image url</label>
                <input type="text" id="url-${item.id}" value="${custom.img || ""}" placeholder="Paste image URL (or upload above)" oninput="handleUrlInput('${item.id}', this.value)" />
                <div class="preset-pills">
                  <span style="font-size:0.7rem;color:var(--coffee-500);">presets:</span>
                  <button type="button" class="preset-btn" onclick="applyPreset('${item.id}', 'images/sticker-cats.jpg')">cats</button>
                  <button type="button" class="preset-btn" onclick="applyPreset('${item.id}', 'images/sticker-celestial.jpg')">celestial</button>
                  <button type="button" class="preset-btn" onclick="applyPreset('${item.id}', 'images/sticker-food.jpg')">food</button>
                  <button type="button" class="preset-btn" onclick="applyPreset('${item.id}', 'images/sticker-cozy.jpg')">cozy</button>
                  <button type="button" class="preset-btn" onclick="applyPreset('${item.id}', 'images/1111-removebg-preview.png')">cat logo</button>
                </div>
              </div>

              <!-- Category & Badge -->
              <div class="admin-form-row">
                <div class="admin-input-group">
                  <label>category</label>
                  <select id="cat-${item.id}">
                    <option value="posters" ${currentCategory === "posters" ? "selected" : ""}>Posters</option>
                    <option value="single stickers" ${currentCategory === "single stickers" ? "selected" : ""}>Single Stickers</option>
                    <option value="sticker sheet" ${currentCategory === "sticker sheet" ? "selected" : ""}>Sticker Sheet</option>
                  </select>
                </div>
                <div class="admin-input-group">
                  <label>badge (optional)</label>
                  <select id="badge-${item.id}">
                    <option value="" ${!currentBadge ? "selected" : ""}>Auto (stock based)</option>
                    <option value="new" ${currentBadge === "new" ? "selected" : ""}>New Drop</option>
                    <option value="bestseller" ${currentBadge === "bestseller" ? "selected" : ""}>Bestseller</option>
                    <option value="low stock" ${currentBadge === "low stock" ? "selected" : ""}>Low Stock</option>
                    <option value="sold out" ${currentBadge === "sold out" ? "selected" : ""}>Sold Out</option>
                  </select>
                </div>
              </div>

              <div class="admin-input-group">
                <label>custom description (optional)</label>
                <input type="text" id="desc-${item.id}" value="${currentDesc}" placeholder="Leave blank for default description" />
              </div>
            </div>

            <!-- Actions -->
            <div class="admin-actions-col">
              <button type="button" class="btn btn-primary save-item-btn" id="save-btn-${item.id}" onclick="saveSingleItem('${item.id}')">
                <i data-lucide="check" class="icon-xs"></i> save
              </button>
              <button type="button" class="reset-item-btn" onclick="resetSingleItem('${item.id}')">
                reset to default
              </button>
            </div>
          </div>
        `;
      }).join("");

      renderIcons();
    }

    // ── CATEGORY INFERENCE ──
    function inferCategory(name, sku) {
      const n = (name + " " + (sku || "")).toLowerCase();
      if (n.includes("poster") || n.includes("print")) return "posters";
      if (n.includes("sheet") || n.includes("pack") || n.includes("bundle") || n.includes("set")) return "sticker sheet";
      return "single stickers";
    }

    // ── SEARCH FILTER ──
    function filterAdminItems() {
      const q = (document.getElementById("admin-search")?.value || "").toLowerCase().trim();
      if (!q) {
        renderAdminItems(adminStockItems);
        return;
      }
      const filtered = adminStockItems.filter(item => {
        return (item.itemName + " " + (item.sku || "")).toLowerCase().includes(q);
      });
      renderAdminItems(filtered);
    }

    // ── STATS UPDATE ──
    function updateAdminStats() {
      document.getElementById("stat-total").textContent = adminStockItems.length;
      let posters = 0, singles = 0, sheets = 0;

      adminStockItems.forEach(item => {
        const custom = customPictureMap[item.id] || customPictureMap[item.itemName] || {};
        const cat = custom.category || inferCategory(item.itemName, item.sku);
        if (cat === "posters") posters++;
        else if (cat === "sticker sheet") sheets++;
        else singles++;
      });

      document.getElementById("stat-posters").textContent = posters;
      document.getElementById("stat-single").textContent = singles;
      document.getElementById("stat-sheets").textContent = sheets;
    }

    // ── PRESET & URL HANDLING ──
    function handleUrlInput(itemId, url) {
      const preview = document.getElementById(`img-preview-${itemId}`);
      if (preview && url) preview.src = url;
    }

    function applyPreset(itemId, presetUrl) {
      const input = document.getElementById(`url-${itemId}`);
      const preview = document.getElementById(`img-preview-${itemId}`);
      if (input) input.value = presetUrl;
      if (preview) preview.src = presetUrl;
    }

    // ── IMAGE FILE UPLOAD WITH CLIENT COMPRESSION ──
    function handleImageUpload(itemId, e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Compress to max 800x800 for optimal fast load & 0 neon storage
          const canvas = document.createElement("canvas");
          const MAX_SIZE = 800;
          let width = img.width;
          let height = img.height;

          if (width > height && width > MAX_SIZE) {
            height *= MAX_SIZE / width;
            width = MAX_SIZE;
          } else if (height > MAX_SIZE) {
            width *= MAX_SIZE / height;
            height = MAX_SIZE;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.85);

          const input = document.getElementById(`url-${itemId}`);
          const preview = document.getElementById(`img-preview-${itemId}`);
          if (input) input.value = compressedDataUrl;
          if (preview) preview.src = compressedDataUrl;

          showToast("Image compressed & ready! Click Save to apply ✦");
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ── SAVE SINGLE ITEM ──
    function saveSingleItem(itemId) {
      const url = (document.getElementById(`url-${itemId}`)?.value || "").trim();
      const cat = document.getElementById(`cat-${itemId}`)?.value || "single stickers";
      const badge = document.getElementById(`badge-${itemId}`)?.value || "";
      const desc = (document.getElementById(`desc-${itemId}`)?.value || "").trim();

      const item = adminStockItems.find(i => String(i.id) === String(itemId));

      customPictureMap[itemId] = {
        img: url || (item ? getProductImage(item.itemName, item.sku) : "images/sticker-cozy.jpg"),
        category: cat,
        badge: badge,
        desc: desc,
      };

      if (item && item.itemName) {
        customPictureMap[item.itemName] = customPictureMap[itemId];
      }

      saveStorefrontPictureMap(customPictureMap);
      updateAdminStats();

      const btn = document.getElementById(`save-btn-${itemId}`);
      if (btn) {
        btn.innerHTML = `<i data-lucide="check" class="icon-xs"></i> saved!`;
        btn.style.background = "#27ae60";
        setTimeout(() => {
          btn.innerHTML = `<i data-lucide="check" class="icon-xs"></i> save`;
          btn.style.background = "";
          renderIcons();
        }, 1500);
      }

      showToast("Item picture & category saved ✦");
    }

    // ── RESET SINGLE ITEM ──
    function resetSingleItem(itemId) {
      const item = adminStockItems.find(i => String(i.id) === String(itemId));
      delete customPictureMap[itemId];
      if (item && item.itemName) delete customPictureMap[item.itemName];

      saveStorefrontPictureMap(customPictureMap);
      renderAdminItems();
      updateAdminStats();
      showToast("Reset to default");
    }

    // ── SAVE ALL ITEMS ──
    function saveAllItems() {
      adminStockItems.forEach(item => {
        const url = (document.getElementById(`url-${item.id}`)?.value || "").trim();
        const cat = document.getElementById(`cat-${item.id}`)?.value || "single stickers";
        const badge = document.getElementById(`badge-${item.id}`)?.value || "";
        const desc = (document.getElementById(`desc-${item.id}`)?.value || "").trim();

        if (url || cat || badge || desc) {
          customPictureMap[item.id] = {
            img: url || getProductImage(item.itemName, item.sku),
            category: cat,
            badge: badge,
            desc: desc,
          };
          if (item.itemName) customPictureMap[item.itemName] = customPictureMap[item.id];
        }
      });

      saveStorefrontPictureMap(customPictureMap);
      updateAdminStats();
      showToast("All product pictures & categories saved ✦");
    }

    // ── EXPORT & IMPORT JSON ──
    function exportPictureConfig() {
      const blob = new Blob([JSON.stringify(customPictureMap, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `static-storefront-pictures-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      showToast("Picture database exported ✦");
    }

    function importPictureConfig(e) {
      const file = e.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          customPictureMap = { ...customPictureMap, ...parsed };
          saveStorefrontPictureMap(customPictureMap);
          renderAdminItems();
          updateAdminStats();
          showToast("Picture database imported successfully ✦");
        } catch (_) {
          showToast("Invalid JSON file format");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
